<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Planner - PocketSmart AI</title>
    <link rel="stylesheet" href="/static/css/style.css?v=11">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="nav-logo"><img src="/static/img/logo.png" alt="PocketSmart AI logo"></div>
            <span class="nav-brand-text">PocketSmart AI</span>
        </a>
        <div class="nav-toggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="/">Home</a></li>
            <li><a href="/home-planner">Home Planner</a></li>
            <li><a href="/party-planner">Party Planner</a></li>
            <li><a href="/jewelry-planner" class="active">Jewelry</a></li>
            <li><a href="/history">History</a></li>
            <li><a href="/login">Login</a></li>
            <li><a href="/register">Register</a></li>
        </ul>
    </nav>
    <main>
        <div class="form-container">
            <div class="form-card">
                <h2>Jewelry Budget Planner</h2>
                <p class="subtitle">Find the perfect piece for any occasion</p>
                <form id="jewelryForm">
                    <div class="form-group">
                        <label>Budget (₹)</label>
                        <input type="number" id="budget" name="budget" required min="1" step="0.01" placeholder="e.g., 100">
                    </div>
                    <div class="form-group">
                        <label>Occasion</label>
                        <select id="occasion" name="occasion" required>
                            <option value="wedding">Wedding</option>
                            <option value="anniversary">Anniversary</option>
                            <option value="birthday">Birthday</option>
                            <option value="festival">Festival</option>
                            <option value="engagement">Engagement</option>
                            <option value="casual">Casual Wear</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Style Preference</label>
                        <select id="style" name="style" required>
                            <option value="traditional">Traditional</option>
                            <option value="modern">Modern</option>
                            <option value="minimalist">Minimalist</option>
                            <option value="luxury">Luxury</option>
                            <option value="ethnic">Ethnic</option>
                            <option value="contemporary">Contemporary</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Outfit Image URL (optional)</label>
                        <input type="url" id="outfit_image_url" name="outfit_image_url" placeholder="https://example.com/outfit.jpg">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Get Recommendations</button>
                </form>
                <div id="jewelryResults" class="results-section"></div>
                <div id="jewelryLoading" class="loading" style="display:none">
                    <div class="spinner"></div>
                    <p>Analyzing your jewelry preferences with AI...</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-brand">PocketSmart AI</div>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>
    <button class="scroll-top" id="scrollTop" onclick="window.scrollTo(0,0)">↑</button>
    <script src="/static/js/main.js"></script>
</body>
</html>
